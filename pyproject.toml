# The doppel runtime: one repo, a uv workspace with one package per component (see README "Layout").
[project]
name = "doppel-runtime"
version = "0.1.0"
description = "The runtime behind Doppel as a Service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "doppel-shared",
    "doppel-control-plane",
    "doppel-gateway",
    "doppel-model-provider",
    "doppel-sandbox",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/*"]

[tool.uv.sources]
doppel-shared = { workspace = true }
doppel-control-plane = { workspace = true }
doppel-gateway = { workspace = true }
doppel-model-provider = { workspace = true }
doppel-sandbox = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["src/control-plane/tests", "src/gateway/tests", "src/model-provider/tests", "tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
