name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q

  host-command:
    name: The host command (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/doppel-runtime-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Builds for every platform it ships on
        run: |
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null .
          done

  linux-runner-e2e:
    name: Linux runner end to end (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install gVisor
        working-directory: ${{ runner.temp }}
        run: |
          base="https://storage.googleapis.com/gvisor/releases/release/20261116/$(uname -m)"
          curl -fsSLO "$base/gvisor.tar.zstd"
          curl -fsSLO "$base/gvisor.tar.zstd.sha512"
          sha512sum -c gvisor.tar.zstd.sha512
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'
      - run: uv sync --locked
      - name: Pair a runner and review a PR in gVisor
        env:
          DOPPEL_DOCKER_TESTS: "1"
          DOPPEL_TEST_SANDBOX_RUNTIME: runsc
        run: uv run pytest -q tests/integration/test_runtime_docker.py
      - name: The runner in a container, from its volume (gVisor found automatically)
        env:
          DOPPEL_DOCKER_TESTS: "1"
          DOPPEL_TEST_SANDBOX_RUNTIME: runsc
        run: uv run pytest -q tests/integration/test_runner_container.py
      - name: The host command against real Docker (pair, review, update, roll back, uninstall)
        env:
          DOPPEL_DOCKER_TESTS: "1"
        run: uv run pytest -q tests/integration/test_host_command.py
