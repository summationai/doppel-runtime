[project]
name = "doppel-sandbox"
version = "0.1.0"
description = "What runs inside a PR's pod: the harness and its image (checkpoint 5)."
requires-python = ">=3.12"
dependencies = [
    "doppel-shared",
]

[tool.uv.sources]
doppel-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doppel_sandbox"]
