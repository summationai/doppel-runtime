[project]
name = "doppel-control-plane"
version = "0.1.0"
description = "The runtime process: intake, scheduler, merger, ledger."
requires-python = ">=3.12"
dependencies = [
    "doppel-shared",
    "doppel-gateway",
    "doppel-model-provider",
    "aiohttp>=3.10",
]

[project.scripts]
doppel-runtime = "doppel_control_plane.cli:main"

[tool.uv.sources]
doppel-shared = { workspace = true }
doppel-gateway = { workspace = true }
doppel-model-provider = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doppel_control_plane"]
