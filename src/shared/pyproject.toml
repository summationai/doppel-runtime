[project]
name = "doppel-shared"
version = "0.1.0"
description = "Contracts between the doppel runtime's components: types and ports."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doppel_shared"]
