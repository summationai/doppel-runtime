[project]
name = "doppel-model-provider"
version = "0.1.0"
description = "The broker: each payer's model sign-in, refresh, and durable copy."
requires-python = ">=3.12"
dependencies = [
    "doppel-shared",
    "aiohttp>=3.10",
    "openai-codex==0.167.2",  # the Codex SDK; installs the matching codex binary
]

[tool.uv.sources]
doppel-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doppel_model_provider"]
